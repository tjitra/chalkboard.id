name: Build App ARM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/chalkboard_build"
      NEXTAUTH_SECRET: "build-time-secret-key-for-github-actions-only"
      NEXTAUTH_URL: "http://localhost:3000"
      DEPLOYMENT_MODE: "auto"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build check
        run: bun run build

  build-tauri:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (PC)
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
          # Linux ARM64 (Raspberry Pi 3B+ / 4 / 5 - 64-bit OS)
          - platform: ubuntu-22.04
            rust-targets: 'aarch64-unknown-linux-gnu'
            args: '--target aarch64-unknown-linux-gnu'
          # Windows x86_64
          - platform: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      DEPLOYMENT_MODE: desktop
      NEXTAUTH_SECRET: "build-time-secret-key-for-github-actions-only"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dependensi khusus Linux (termasuk Cross-Compiler ARM64 untuk Pi)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          if [ "${{ matrix.rust-targets }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-manual' }}
          releaseName: 'Chalkboard Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'Manual Build' }}'
          releaseBody: 'Desktop build generated by GitHub Actions.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
